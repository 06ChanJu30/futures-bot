# ===== 텔레그램 시그널 채점 설정 =====
# '이 방 시그널을 내가 따라 했으면 실제로 얼마였을까'를 계산하는 조건이에요.

price_exchange: binance      # 1분봉 시세를 가져올 거래소 (ccxt id). 실제로 쓸 거래소로 맞추세요
delay_sec: 10                # 메시지를 받고 주문이 들어가기까지 걸리는 시간 (초)
                             # 체결가 = 메시지 시각 + 지연 이후 '다음 1분봉 시가' (보수적)

costs:
  taker_fee: 0.0005          # 시장가 수수료 0.05% (진입·청산 각각)
  slippage_major: 0.0002     # BTC·ETH 슬리피지 0.02%
  slippage_alt: 0.0006       # 그 외 알트코인 0.06%
  funding_8h: 0.0001         # 펀딩 시각(UTC 0·8·16시)을 지나면 0.01% (롱은 냄, 숏은 받음 — 근사)
  majors: [BTC, ETH]

sizing:
  start_equity: 700          # 가상 시작 자본 (USDT) ≈ 100만 원 (사용자 운용 예정 금액)
  margin_per_trade: 0.10     # 거래 1건당 증거금 = 자본의 10%
  max_leverage: 3            # 시그널 레버리지를 따르되 최대 3배로 제한
                             # (시그널은 3~10배를 쓰지만, 따라 하는 쪽은 지연 때문에 불리해서 낮게)
  maintenance_margin: 0.005  # 강제청산 계산용 유지증거금률

# 봇 자체 보호 손절 후보 (진입가 대비 가격 변동 %). 각각 썼다면 어땠을지 비교해요.
# 시그널 종료보다 먼저 걸리면 손해일 수 있어서, 너무 좁지 않은 값을 찾는 게 목적이에요.
stop_candidates: [null, 0.02, 0.03, 0.05, 0.08]

# ===== LEVIA 코어 알림 + 가이드북 규칙 시뮬레이션 (levia_sim.py) =====
levia:
  symbols: [BTC]             # 가이드북: 비트코인만 거래
  also_test_alts: true       # 참고용: 알트 알림에도 같은 규칙을 적용한 결과를 따로 표시
  leverage: 10               # 가이드북: 10배 고정
  full_position_margin: 1.0  # 100% 진입 시 증거금 = 거래 자본의 몇 배 (1.0 = 전액. 가이드북 '작은 시드'로 전액 사용 가정)
  first_entry: 0.5           # 1차 진입 50%
  add_when_better: true      # 새 같은 방향 알림 기준가가 평단보다 유리하면 2차 진입(나머지 50%)
  delay_sec: 10              # 알림을 받고 주문이 들어가기까지 (초)
  order_max_hours: 24        # 미체결 지정가 주문을 최대 몇 시간 유지할지 (가이드북에 없음 → 가정)
  max_hold_hours: 72         # 익절·손절 모두 안 닿으면 몇 시간 뒤 정리할지 (가이드북에 없음 → 안전장치)
  consecutive_stop_limit: 2  # 2회 연속 손절이면 그날(KST) 매매 종료
  withdraw_ratio: 0.5        # 익절 수익의 50% 출금
  maker_fee: 0.0002          # 지정가 체결 수수료
  taker_fee: 0.0005          # 시장가(손절·즉시체결) 수수료
  slippage: 0.0002           # 시장가 체결 미끄러짐
  maintenance_margin: 0.005
  start_equity: 700          # ≈ 100만 원 (사용자 운용 예정 금액)
  sides: [long, short]       # 롱·숏 모두 매매 (사용자 결정 2026-10-27)
  # 가이드북 기본 사례 (리포트 맨 위에 표시)
  base: {stop_seed: 0.05, tp_ratio: 1.0, on_opposite: cancel_pending, cross_ref: false}
  # 비교할 조합 (가이드북이 정하지 않았거나 범위로만 준 부분)
  grid:
    stop_seed: [0.02, 0.03, 0.05, 0.08]        # 손절: 시드 대비 -2~-8%
    tp_ratio: [1.0, 1.5, 2.0]                  # 익절 = 손절폭 × 배수 (손익비 1:1 이상)
    on_opposite: [ignore, cancel_pending, close]  # 반대 알림이 오면: 무시 / 미체결만 취소 / 포지션도 청산
    cross_ref: [false, true]                   # 알트 알림을 BTC 알림으로 간주 (가이드북 8번, 실험)
